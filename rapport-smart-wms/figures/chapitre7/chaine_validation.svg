  <text x="1075" y="200" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#152638" font-weight="400" text-anchor="middle"><tspan x="1075" dy="0">règles testables</tspan><tspan x="1075" dy="18">retours encadrante</tspan></text>
