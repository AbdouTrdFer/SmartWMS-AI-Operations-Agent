  <line x1="592" y1="185" x2="655" y2="185" stroke="#173F66" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="670" y="130" width="210" height="110" rx="15" fill="#FAF7FF" stroke="#7D60C8" stroke-width="2"/>
  <text x="775" y="170" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#7D60C8" font-weight="700" text-anchor="middle"><tspan x="775" dy="0">UML</tspan></text>
