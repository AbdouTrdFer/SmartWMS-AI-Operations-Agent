  <text x="175" y="200" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#152638" font-weight="400" text-anchor="middle"><tspan x="175" dy="0">réception</tspan><tspan x="175" dy="18">stock</tspan><tspan x="175" dy="18">expédition</tspan></text>
